name: CI/CD Pipeline

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test-build:
    name: Backend + Frontend Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install backend dependencies
        if: matrix.service == 'backend'
        working-directory: apps/backend
        run: npm install

      - name: Install frontend dependencies
        if: matrix.service == 'frontend'
        working-directory: apps/frontend
        run: npm install

      - name: Run backend tests
        if: matrix.service == 'backend'
        working-directory: apps/backend
        run: npm test

      - name: Build and test frontend
        if: matrix.service == 'frontend'
        working-directory: apps/frontend
        env:
          CI: true
        run: |
          npm test -- --watchAll=false --passWithNoTests
          npm run build

  build-push-ecr:
    name: Build, Push Images, and Update GitOps Tags
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push'
    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com
      BACKEND_REPO: backend-ecr-repo
      FRONTEND_REPO: frontend-ecr-repo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Ensure backend ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $BACKEND_REPO || aws ecr create-repository --repository-name $BACKEND_REPO

      - name: Ensure frontend ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $FRONTEND_REPO || aws ecr create-repository --repository-name $FRONTEND_REPO

      - name: Build and push backend image
        run: |
          docker build -t $ECR_REGISTRY/$BACKEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$BACKEND_REPO:latest -f apps/backend/Dockerfile apps/backend
          docker push $ECR_REGISTRY/$BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest

      - name: Build and push frontend image
        run: |
          docker build -t $ECR_REGISTRY/$FRONTEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$FRONTEND_REPO:latest -f apps/frontend/Dockerfile apps/frontend
          docker push $ECR_REGISTRY/$FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FRONTEND_REPO:latest

      - name: Update ArgoCD backend image tag in manifests
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          tag = "${{ env.IMAGE_TAG }}"
          app_path = Path('argocd/backend-app.yaml')
          app_text = app_path.read_text()
          app_text = re.sub(r'(tag:\s*).+$', r'\1' + tag, app_text, count=1)
          app_path.write_text(app_text)

          deploy_path = Path('kubernetes/02-backend-deployment.yaml')
          deploy_text = deploy_path.read_text()
          deploy_text = re.sub(r'(image:\s*.*:).+$', r'\1' + tag, deploy_text, count=1)
          deploy_path.write_text(deploy_text)
          PY

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/backend-app.yaml kubernetes/02-backend-deployment.yaml || true
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "ci: update backend image tag to $IMAGE_TAG"
            git push origin HEAD
          fi
